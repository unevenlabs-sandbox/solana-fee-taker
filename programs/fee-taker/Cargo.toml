[package]
name = "fee-taker"
version = "0.1.0"
description = "Forwards a fixed fee to a constant fee recipient and the rest of the balance to a recipient"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "fee_taker"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
